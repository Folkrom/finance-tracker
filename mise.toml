[tools]
go = "1.24"
node = "20"

[env]
_.file = ["backend/.env", "frontend/.env.local"]

[tasks.dev-backend]
run = "cd backend && go run ./cmd/server"
description = "Run backend dev server"

[tasks.dev-frontend]
run = "cd frontend && npm run dev"
description = "Run frontend dev server"

[tasks.migrate-up]
run = "cd backend && go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest -path=migrations -database \"$DATABASE_URL\" up"
description = "Run database migrations"

[tasks.migrate-down]
run = "cd backend && go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest -path=migrations -database \"$DATABASE_URL\" down 1"
description = "Rollback last migration"

[tasks.test-backend]
run = "cd backend && go test ./... -v"
description = "Run backend tests (uses finance_tracker_test DB, see test-db-setup)"

[tasks.test-db-setup]
run = """
docker compose exec postgres psql -U finance -d finance_tracker -c 'CREATE DATABASE finance_tracker_test OWNER finance;' || true
cd backend && go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest -path=migrations -database "postgres://finance:finance_dev@localhost:5466/finance_tracker_test?sslmode=disable" up
"""
description = "Create and migrate the test database"

[tasks.test-frontend]
run = "cd frontend && npm test"
description = "Run frontend tests"
